<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Your Creative Session | Lotus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="appointment.css">

    <!-- EMAILJS -->
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

    <!-- JS (IMPORTANT) -->
    <script src="appointment.js" defer></script>
</head>

<body>

<section class="booking-hero">
    <div class="form-container">

        <h1>Let's Plan Future Together</h1>
        <p>Fill out the details below and let’s craft a bold digital experience together.</p>

        <form id="bookingForm">
            <input type="text" name="fullName" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email ID" required>
            <input type="tel" name="phone" placeholder="Phone Number" required>
            <input type="date" name="date" id="appointmentDate" required>

            <button type="submit" class="btn submit-btn">
                Book Appointment
            </button>
        </form>

        <!-- POPUP -->
        <div id="confirmationPopup" class="popup">
            <div class="popup-content">
                <p>
                    Your appointment has been successfully booked! <br>
                    We'll contact you soon.
                </p>
                <button id="popupClose">OK</button>
            </div>
        </div>

    </div>
</section>

</body>
</html>
